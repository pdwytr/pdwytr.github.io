{{- partial "validate.html" . -}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ partial "head.html" . }}
  {{ partial "css.html" . }}
  {{ partial "theme-init.html" . }}
</head>
<body>
  <div class="shell">
    <header class="site-head">
      <a class="site-head__name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      {{ partial "theme-toggle.html" . }}
      {{ partial "nav.html" . }}
    </header>
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
