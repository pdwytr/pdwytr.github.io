{{- with .Page.Resources.GetMatch .Destination -}}
  {{- /* GIFs are served as-is: resizing would drop or bloat the animation. */ -}}
  {{- $img := . -}}
  {{- if ne .MediaType.SubType "gif" }}{{ $img = .Resize "1200x webp q82" }}{{ end -}}
  <figure>
    <img src="{{ $img.RelPermalink }}"
         width="{{ $img.Width }}" height="{{ $img.Height }}"
         alt="{{ $.Text }}" loading="lazy" decoding="async">
    {{- with $.Title }}<figcaption>{{ . }}</figcaption>{{ end -}}
  </figure>
{{- else -}}
  <img src="{{ .Destination }}" alt="{{ .Text }}" loading="lazy" decoding="async">
{{- end -}}
