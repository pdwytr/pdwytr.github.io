<button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark theme" title="Switch to dark theme" data-theme-toggle>
  <span class="theme-toggle__track" aria-hidden="true">
    <span class="theme-toggle__thumb">
      <svg class="theme-toggle__sun" viewBox="0 0 16 16"><path d="M8 3.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9ZM8 0v2M8 14v2M0 8h2M14 8h2M2.3 2.3l1.4 1.4M12.3 12.3l1.4 1.4M13.7 2.3l-1.4 1.4M3.7 12.3l-1.4 1.4"/></svg>
      <svg class="theme-toggle__moon" viewBox="0 0 16 16"><path d="M13.8 10.1A6 6 0 0 1 5.9 2.2a6 6 0 1 0 7.9 7.9Z"/></svg>
    </span>
  </span>
</button>
<script>
var themeToggle = document.querySelector("[data-theme-toggle]");
function syncThemeToggle() {
  var r = document.documentElement;
  var dark = r.dataset.theme === "dark";
  themeToggle.setAttribute("aria-checked", dark ? "true" : "false");
  themeToggle.setAttribute("title", dark ? "Switch to light theme" : "Switch to dark theme");
}
syncThemeToggle();
themeToggle.addEventListener("click", function () {
  var r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("theme", r.dataset.theme); } catch (e) {}
  syncThemeToggle();
});
</script>
