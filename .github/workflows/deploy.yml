name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # enableGitInfo needs full history for lastmod

      - name: Install pinned Hugo (extended)
        run: |
          set -euo pipefail
          V="$(cat .hugoversion)"
          curl -sSLf -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${V}/hugo_extended_${V}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version | tee /dev/stderr | grep -q extended

      - name: Build
        run: hugo --gc --minify --baseURL "https://moknshaik.com/"

      - name: Confirm custom domain survives the build
        run: grep -qx "moknshaik.com" public/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
