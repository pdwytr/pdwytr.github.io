baseURL = "https://moknshaik.com/"
locale = "en-us"                 # NOT languageCode — deprecated in Hugo 0.158.0
title = "Mohammed Khalid Shaik"
enableRobotsTXT = true
enableGitInfo = true
timeZone = "America/Chicago"

# lastmod's default resolution order (when enableGitInfo is true) is
# ["lastmod", ":git", "date", "publishdate"] — meaning .Lastmod silently
# falls back to the file's last git-commit date on every page that doesn't
# set `lastmod` in frontmatter, and churns on every unrelated commit. Drop
# ":git" from the chain so .Lastmod only differs from .Date when a post's
# frontmatter explicitly sets `lastmod`.
[frontmatter]
  lastmod = ["lastmod", "date"]

# Only tags. Hugo's default also enables categories, which we do not want.
[taxonomies]
  tag = "tags"

# Hugo 0.162+ denies text/html content files by default (CVE-2026-50133,
# raw-HTML-content-file XSS hardening), and overriding allowContent replaces
# the whole list rather than extending it — so text/markdown (our normal
# content format) must be re-listed alongside it. We hand-author every
# content file ourselves (no untrusted/CMS input), so both are safe to opt
# back in. This is what lets content/writing/essentials-of-production-python/
# index.html render at all.
[security]
  allowContent = ['^text/html$', '^text/markdown$']

[markup.goldmark.renderer]
  unsafe = true          # allow raw HTML inside markdown

[markup.highlight]
  noClasses = false      # emit CSS classes so both themes can be styled
  lineNos = false
  tabWidth = 2

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[outputs]
  home = ["html", "rss", "json"]

# Spec calls for /rss.xml; Hugo's default base name is "index".
[outputFormats.rss]
  baseName = "rss"

[params]
  author = "Mohammed Khalid Shaik"
  description = "Backend-leaning application engineer. Python services, APIs, and the systems around them."
  email = "moknshaik@gmail.com"
  github = "https://github.com/pdwytr"
  twitter = "https://x.com/pdwytrfa"
  linkedin = "https://www.linkedin.com/in/pdwytr/"
